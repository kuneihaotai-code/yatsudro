<style>
@font-face {
  font-family: 'Semamojikana';
  src: url('Semamojikana-Bold.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}
:root {
  --white: #ffffff;
  --snow: #f4f7fb;
  --mist: #e4ecf5;
  --ridge: #c8d8ea;
  --sky: #4a7fa8;
  --deep: #1d3a5c;
  --peak: #0d2240;
  --gold: #b8996a;
  --text: #2c3e52;
  --sub: #6b7f96;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--white); color: var(--text); overflow-x: hidden; }

/* ===== NAV ===== */
nav {
  position: fixed; top: 0; width: 100%; z-index: 100;
  padding: 1.1rem 3rem;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--mist);
  transition: box-shadow 0.3s;
}
nav.scrolled { box-shadow: 0 2px 24px rgba(29,58,92,0.1); }
.logo {
  font-family: 'Shippori Mincho B1', serif;
  font-size: 1.05rem; font-weight: 700;
  color: var(--deep); letter-spacing: 0.04em;
  text-decoration: none;
  display: flex; flex-direction: row; align-items: center; gap: 0.6rem;
}
.logo-img { height: 38px; width: 38px; object-fit: contain; flex-shrink: 0; border-radius: 50%; }
.logo-text { display: flex; flex-direction: column; line-height: 1; align-items: center; }
.logo-name { font-family: 'Semamojikana', sans-serif; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.05em; }
.logo-sub {
  font-size: 0.55rem; display: block;
  color: var(--sky); font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300; letter-spacing: 0.18em; margin-top: 2px;
  text-align: center; white-space: nowrap;
}

/* ===== HAMBURGER ===== */
.nav-links { display: none !important; }
.menu-btn {
  position: fixed; top: 1.1rem; right: 1.5rem; z-index: 200;
  width: 50px; height: 50px;
  background: var(--deep);
  border: none; cursor: pointer;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 5px;
  transition: background 0.3s, transform 0.3s;
  box-shadow: 0 4px 20px rgba(13,34,64,0.28);
}
.menu-btn:hover { background: var(--peak); transform: scale(1.05); }
.menu-btn span {
  display: block; width: 22px; height: 1.5px;
  background: #fff;
  transition: transform 0.4s cubic-bezier(0.23,1,0.32,1), opacity 0.3s;
  transform-origin: center;
}
.menu-btn.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.menu-btn.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.nav-overlay {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 150;
  background: var(--peak);
  width: 260px;
  padding: 5.5rem 2rem 2.5rem;
  transform: translateX(100%);
  transition: transform 0.45s cubic-bezier(0.77,0,0.175,1);
  pointer-events: none;
  box-shadow: -8px 0 40px rgba(13,34,64,0.28);
  display: flex; flex-direction: column; justify-content: flex-start;
}
.nav-overlay.open { transform: translateX(0); pointer-events: all; }
.nav-overlay ul { list-style: none; display: block; }
.nav-overlay ul li {
  overflow: hidden;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.nav-overlay ul li:first-child { border-top: 1px solid rgba(255,255,255,0.07); }
.nav-overlay ul a {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.82rem;
  font-weight: 500; color: rgba(255,255,255,0.65);
  text-decoration: none;
  padding: 1rem 0;
  letter-spacing: 0.14em;
  display: flex; align-items: center; gap: 0.6rem;
  white-space: nowrap;
  transform: translateX(18px); opacity: 0;
  transition: color 0.25s, transform 0.45s cubic-bezier(0.23,1,0.32,1), opacity 0.45s cubic-bezier(0.23,1,0.32,1);
}
.nav-overlay ul a::before {
  content: ''; display: inline-block;
  width: 14px; height: 1px; background: var(--sky);
  flex-shrink: 0; transition: width 0.3s;
}
.nav-overlay ul a:hover { color: #fff; }
.nav-overlay ul a:hover::before { width: 22px; }
.nav-overlay.open ul a { transform: translateX(0); opacity: 1; }
.nav-overlay ul li:nth-child(1) a { transition-delay: 0.10s; }
.nav-overlay ul li:nth-child(2) a { transition-delay: 0.17s; }
.nav-overlay ul li:nth-child(3) a { transition-delay: 0.24s; }
.nav-overlay ul li:nth-child(4) a { transition-delay: 0.31s; }
.nav-overlay-sub {
  margin-top: auto; padding-top: 2rem;
  font-size: 0.58rem; letter-spacing: 0.22em;
  color: rgba(255,255,255,0.16);
  opacity: 0; transition: opacity 0.4s 0.36s;
}
.nav-overlay.open .nav-overlay-sub { opacity: 1; }

/* ===== ARTICLE LAYOUT ===== */
.article-wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 8rem 2rem 7rem;
}

/* Breadcrumb */
.breadcrumb {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.7rem; color: var(--sub); letter-spacing: 0.08em;
  margin-bottom: 2.5rem;
}
.breadcrumb a { color: var(--sky); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb span { opacity: 0.4; }

/* Article header */
.article-meta {
  display: flex; align-items: center; gap: 0.8rem;
  margin-bottom: 1.2rem;
}
.article-date { font-size: 0.72rem; color: var(--sub); letter-spacing: 0.12em; }
.article-tag {
  font-size: 0.64rem; letter-spacing: 0.1em;
  padding: 0.25rem 0.8rem; font-weight: 500;
}
.tag-news { background: var(--mist); color: var(--sky); }
.tag-blog { background: rgba(184,153,106,0.12); color: var(--gold); }
.tag-report { background: rgba(74,127,168,0.1); color: var(--sky); }

.article-title {
  font-family: 'Shippori Mincho B1', serif;
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 800; color: var(--peak);
  line-height: 1.45; margin-bottom: 2.5rem;
}

/* Hero image */
.article-hero-img {
  width: 100%; height: 340px;
  object-fit: cover; display: block;
  margin-bottom: 3rem;
  background: linear-gradient(135deg, var(--mist) 0%, var(--ridge) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 5rem;
}

/* Article body */
.article-body {
  font-size: 0.95rem; line-height: 2.15; color: var(--text);
}
.article-body p { margin-bottom: 1.6em; }
.article-body h2 {
  font-family: 'Shippori Mincho B1', serif;
  font-size: 1.3rem; font-weight: 700;
  color: var(--peak); margin: 2.8em 0 1em;
  padding-left: 1rem;
  border-left: 3px solid var(--sky);
}
.article-body h3 {
  font-family: 'Shippori Mincho B1', serif;
  font-size: 1.05rem; font-weight: 700;
  color: var(--deep); margin: 2em 0 0.7em;
}
.article-body ul, .article-body ol {
  padding-left: 1.5rem; margin-bottom: 1.6em;
}
.article-body li { margin-bottom: 0.5em; line-height: 1.9; }
.article-body blockquote {
  border-left: 3px solid var(--ridge);
  padding: 1rem 1.5rem;
  margin: 2em 0;
  background: var(--snow);
  color: var(--sub);
  font-size: 0.9rem;
}
.article-body strong { color: var(--deep); font-weight: 700; }
.article-body a { color: var(--sky); }
.article-body hr {
  border: none; border-top: 1px solid var(--mist);
  margin: 3em 0;
}

/* Divider */
.article-divider {
  width: 40px; height: 1px; background: var(--ridge);
  margin: 3.5rem 0;
}

/* Nav between posts */
.post-nav {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.5px; background: var(--mist);
  border: 1.5px solid var(--mist);
  margin-top: 4rem;
}
.post-nav a {
  background: var(--white); padding: 1.5rem 1.8rem;
  text-decoration: none; color: inherit;
  transition: background 0.25s;
  display: block;
}
.post-nav a:hover { background: var(--snow); }
.post-nav-label {
  font-size: 0.64rem; letter-spacing: 0.2em; color: var(--sub);
  margin-bottom: 0.5rem; display: block;
}
.post-nav-title {
  font-family: 'Shippori Mincho B1', serif;
  font-size: 0.9rem; color: var(--deep); line-height: 1.55;
}
.post-nav .next { text-align: right; }

/* Back to list */
.back-link {
  display: inline-flex; align-items: center; gap: 0.5rem;
  margin-top: 3rem;
  font-size: 0.78rem; color: var(--sky); text-decoration: none;
  letter-spacing: 0.1em;
  transition: gap 0.2s;
}
.back-link:hover { gap: 0.8rem; }

/* ===== FOOTER ===== */
footer {
  background: var(--peak); padding: 2rem 3rem;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.footer-logo { font-family: 'Shippori Mincho B1', serif; color: rgba(255,255,255,0.65); font-size: 0.95rem; }
footer p { font-size: 0.72rem; color: rgba(255,255,255,0.55); }

/* ===== ANIMATIONS ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.article-wrap > * { animation: fadeUp 0.7s both ease-out; }
.breadcrumb   { animation-delay: 0.1s; }
.article-meta { animation-delay: 0.18s; }
.article-title { animation-delay: 0.26s; }
.article-hero-img { animation-delay: 0.34s; }
.article-body { animation-delay: 0.42s; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  nav { padding: 1rem 1.5rem; }
  .article-wrap { padding: 7rem 1.5rem 5rem; }
  .article-hero-img { height: 220px; font-size: 3.5rem; }
  .post-nav { grid-template-columns: 1fr; }
  footer { flex-direction: column; gap: 0.8rem; text-align: center; }
}

<script>
(function(){
  const img = new Image();
  img.onload = function(){
    const c = document.createElement('canvas');
    c.width = c.height = img.width;
    const ctx = c.getContext('2d');
    ctx.beginPath();
    ctx.arc(img.width/2, img.height/2, img.width/2, 0, Math.PI*2);
    ctx.closePath(); ctx.clip();
    ctx.drawImage(img, 0, 0);
    const link = document.querySelector("link[rel~='icon']") || document.createElement('link');
    link.rel = 'icon'; link.type = 'image/png';
    link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  };
  img.src = 'favicon.png';
})();
</script>

<script>
// Nav scroll
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => {
  nav.classList.toggle('scrolled', window.scrollY > 20);
});

// Hamburger
const menuBtn = document.getElementById('menuBtn');
const navOverlay = document.getElementById('navOverlay');
menuBtn.addEventListener('click', () => {
  menuBtn.classList.toggle('open');
  navOverlay.classList.toggle('open');
  document.body.style.overflow = navOverlay.classList.contains('open') ? 'hidden' : '';
});
navOverlay.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    menuBtn.classList.remove('open');
    navOverlay.classList.remove('open');
    document.body.style.overflow = '';
  });
});

// Load article
function loadArticle() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id') || '1';
  const idx = ARTICLES.findIndex(a => a.id === id);
  const article = ARTICLES[idx] || ARTICLES[0];

  document.title = article.title + ' | ヤツドロ。';
  document.getElementById('bcTitle').textContent = article.title;
  document.getElementById('articleDate').textContent = article.date;
  document.getElementById('articleTitle').textContent = article.title;
  document.getElementById('articleBody').innerHTML = article.body;

  const tag = document.getElementById('articleTag');
  tag.textContent = article.tagLabel;
  tag.className = 'article-tag ' + article.tagClass;

  const heroImg = document.getElementById('articleHeroImg');
  heroImg.textContent = article.emoji;

  // Prev / Next
  const prev = ARTICLES[idx - 1];
  const next = ARTICLES[idx + 1];
  const prevEl = document.getElementById('prevPost');
  const nextEl = document.getElementById('nextPost');

  if (prev) {
    prevEl.href = 'news-post.html?id=' + prev.id;
    document.getElementById('prevTitle').textContent = prev.title;
  } else {
    prevEl.style.opacity = '0.35'; prevEl.style.pointerEvents = 'none';
  }
  if (next) {
    nextEl.href = 'news-post.html?id=' + next.id;
    document.getElementById('nextTitle').textContent = next.title;
  } else {
    nextEl.style.opacity = '0.35'; nextEl.style.pointerEvents = 'none';
  }
}

loadArticle();
